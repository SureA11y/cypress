<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text spacing</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 24px; background: #fff; }
  /* Fits as it is; the WCAG 1.4.12 spacing pushes its text past the box,
     which hides what overflows. */
  .badge { display: inline-block; width: 260px; height: 22px; overflow: hidden; white-space: nowrap;
           background: #008000; color: #fff; font-size: 14px; line-height: 22px; padding: 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Text spacing</h1>
  <span class="badge" id="badge">Free shipping on orders over 50 €</span>
</main>
</body>
</html>
