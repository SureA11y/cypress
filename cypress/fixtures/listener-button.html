<!doctype html>
<html lang="en">
<head>
  <title>listener hook fixture</title>
</head>
<body>
  <main>
    <h1>Listeners</h1>
    <!-- A custom button given its click listener from script, with no key
         listener anywhere: Enter and Space do nothing. -->
    <div id="scripted" role="button" tabindex="0">Save</div>
    <!-- The same, with a keydown listener of its own. -->
    <div id="keyed" role="button" tabindex="0">Send</div>
    <!-- An inline onclick whose key handling may have been added from script. -->
    <div id="inline" role="button" tabindex="0" onclick="void 0, save()">Print</div>
  </main>
  <script>
    function save() {}
    document.getElementById('scripted').addEventListener('click', save);
    document.getElementById('keyed').addEventListener('click', save);
    document.getElementById('keyed').addEventListener('keydown', save);
  </script>
</body>
</html>
